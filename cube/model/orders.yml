cubes:
  - name: Orders
    sql_table: public.orders

    measures:
      - name: count
        type: count
        title: 订单数

      - name: revenue
        sql: amount
        type: sum
        title: 销售额
        format: currency

      - name: averageAmount
        sql: amount
        type: avg
        title: 平均订单金额
        format: currency

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
        public: true
        title: 订单ID

      - name: tenantId
        sql: tenant_id
        type: string
        title: 租户

      - name: status
        sql: status
        type: string
        title: 订单状态

      - name: category
        sql: category
        type: string
        title: 商品分类

      - name: region
        sql: region
        type: string
        title: 区域

      - name: amount
        sql: amount
        type: number
        title: 订单金额
        format: currency

      - name: createdAt
        sql: created_at
        type: time
        title: 下单时间
