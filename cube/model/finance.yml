cubes:
  - name: Reimburse
    title: 报销单
    description: 报销单主表，提供报销金额、单据明细、状态、部门和申请人分析。
    sql_table: reimburse

    joins:
      - name: Department
        sql: "{CUBE}.department_id = {Department.id}"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        title: 报销单数量

      - name: totalAmount
        sql: amount
        type: sum
        title: 报销金额
        format: currency

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
        public: true
        title: 报销单ID

      - name: organizationId
        sql: orgnization_id
        type: number
        title: 组织ID

      - name: code
        sql: code
        type: string
        title: 报销单号

      - name: fiscalYearId
        sql: fiscal_year_id
        type: number
        title: 预算年度ID

      - name: schoolYearId
        sql: school_year_id
        type: number
        title: 学年ID

      - name: applyDate
        sql: apply_date
        type: time
        title: 申请时间

      - name: departmentId
        sql: department_id
        type: number
        title: 部门ID

      - name: applyUserId
        sql: apply_user_id
        type: number
        title: 申请人ID

      - name: amount
        sql: amount
        type: number
        title: 单据金额
        format: currency

      - name: statusId
        sql: status_id
        type: number
        title: 状态ID

      - name: businessGuideIds
        sql: business_guide_ids
        type: string
        title: 业务类型

      - name: description
        sql: description
        type: string
        title: 报销事由

      - name: remark
        sql: remark
        type: string
        title: 备注

    segments:
      - name: effective
        sql: "{CUBE}.status_id IN (2, 4)"
        title: 有效单据

      - name: approved
        sql: "{CUBE}.status_id = 4"
        title: 审批通过

      - name: approving
        sql: "{CUBE}.status_id = 2"
        title: 审批中

      - name: rejected
        sql: "{CUBE}.status_id = 3"
        title: 被驳回

      - name: canceled
        sql: "{CUBE}.status_id = 5"
        title: 已撤销

      - name: invalid
        sql: "{CUBE}.status_id = 9"
        title: 已作废

  - name: LaborFeeDetail
    title: 劳务费明细
    sql_table: labor_fee_detail

    joins:
      - name: Reimburse
        sql: "{CUBE}.reimburse_id = {Reimburse.id}"
