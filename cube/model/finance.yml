        type: count
        title: 劳务费明细数量

      - name: laborAmount
        sql: amount
        type: sum
        title: 劳务费金额
        format: currency

      - name: laborAfterTaxAmount
        sql: amount_without_tax
        type: sum
        title: 劳务费税后金额
        format: currency

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
        public: true
        title: 劳务费明细ID

      - name: reimburseId
        sql: reimburse_id
        type: number
        title: 报销单ID

      - name: amount
        sql: amount
        type: number
        title: 劳务费金额
